<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YUMA · card glassmorphism con globo di particelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #010110;
    --muted: #4a4a58;
    --violet: #7c5cfa;
    --magenta: #e0457b;
    --card-radius: 28px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 64px 32px;
    background: #f7f7fb;
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }

  /* Macchie di colore dietro il vetro: senza qualcosa da sfocare,
     il glassmorphism non si vede. */
  .stage {
    position: relative;
    width: min(1240px, 100%);
    isolation: isolate;
  }
  .stage::before,
  .stage::after {
    content: "";
    position: absolute;
    border-radius: 999px;
    filter: blur(90px);
    z-index: -1;
  }
  .stage::before {
    width: 520px; height: 520px;
    left: -80px; top: -60px;
    background: radial-gradient(circle, rgba(124, 92, 250, 0.55), rgba(124, 92, 250, 0) 70%);
  }
  .stage::after {
    width: 560px; height: 560px;
    right: -60px; bottom: -120px;
    background: radial-gradient(circle, rgba(224, 69, 123, 0.45), rgba(224, 69, 123, 0) 70%);
  }

  .card {
    position: relative;
    overflow: hidden;
    border-radius: var(--card-radius);
    padding: 56px 56px 0;
    min-height: 620px;
    /* vetro */
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.3)),
      linear-gradient(135deg, rgba(226, 230, 255, 0.95) 0%, rgba(240, 236, 255, 0.85) 45%, rgba(255, 235, 244, 0.8) 100%);
    backdrop-filter: blur(28px) saturate(150%);
    -webkit-backdrop-filter: blur(28px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.65);
    box-shadow:
      0 40px 90px -40px rgba(1, 1, 16, 0.35),
      0 2px 6px rgba(1, 1, 16, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.85);
  }
  /* riflesso diagonale sul vetro */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 40%);
    z-index: 0;
  }
  /* il contenuto sta sopra il riflesso, altrimenti il testo si slava */
  .card > * { position: relative; z-index: 1; }

  h2 {
    margin: 0;
    font-size: clamp(30px, 3.4vw, 44px);
    font-weight: 500;
    letter-spacing: -0.035em;
    line-height: 1.0;
    max-width: 18ch;
  }
  p.lead {
    margin: 16px 0 0;
    max-width: 52ch;
    font-size: clamp(16px, 1.3vw, 19px);
    line-height: 1.5;
    color: var(--muted);
  }
  h2 { color: var(--ink); }

  .globe-wrap {
    position: relative;
    margin-top: -40px;
    height: 460px;
  }
  canvas { display: block; width: 100%; height: 100%; }

  @media (max-width: 720px) {
    body { padding: 28px 16px; }
    .card { padding: 36px 28px 0; min-height: 0; }
    .globe-wrap { height: 320px; margin-top: 8px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <article class="card">
      <h2>Porta l'AI in ogni angolo dell'azienda</h2>
      <p class="lead">
        Le persone continuano a lavorare come già fanno, con un messaggio, una
        foto o una nota vocale. Sono gli agenti a far girare il processo dietro
        le quinte.
      </p>

      <div class="globe-wrap">
        <canvas id="globe"></canvas>
      </div>
    </article>
  </div>

<script>
(() => {
  const canvas = document.getElementById("globe");
  const ctx = canvas.getContext("2d");
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  const N = 7000;           // particelle sulla sfera
  const TILT = -0.32;       // inclinazione dell'asse
  const VIOLET = [124, 92, 250];
  const MAGENTA = [224, 69, 123];

  // Punti casuali sulla sfera: distribuzione uniforme senza trame visibili
  // (la spirale di Fibonacci lascia righe a moiré, qui non servono).
  const pts = [];
  for (let i = 0; i < N; i++) {
    const y = Math.random() * 2 - 1;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = Math.random() * Math.PI * 2;
    pts.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, j: Math.random() });
  }
  // Pulviscolo sparso appena fuori dalla sfera, come nel riferimento.
  const dust = [];
  for (let i = 0; i < 260; i++) {
    const y = Math.random() * 2 - 1;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = Math.random() * Math.PI * 2;
    const k = 1.02 + Math.random() * 0.12;
    dust.push({ x: Math.cos(theta) * r * k, y: y * k, z: Math.sin(theta) * r * k, j: Math.random() });
  }

  // Due archi: coppie di punti sulla sfera collegati da una curva che si alza.
  const arcs = [
    { a: [0.52, 0.18, 0.84], b: [-0.62, 0.55, 0.55], color: "rgba(124,92,250,0.85)", lift: 1.35 },
    { a: [0.12, -0.05, 0.99], b: [0.88, 0.42, 0.22], color: "rgba(224,69,123,0.85)", lift: 1.3 },
  ];

  let W = 0, H = 0, R = 0, cx = 0, cy = 0;
  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    R = Math.min(W * 0.46, H * 1.15);
    cx = W / 2;
    cy = H * 0.98 + R * 0.06; // il globo esce dal bordo basso, come nel riferimento
  }
  resize();
  new ResizeObserver(resize).observe(canvas);

  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

  function rotate(p, ang) {
    // rotazione attorno all'asse Y, poi inclinazione sull'asse X
    const x = p.x * Math.cos(ang) + p.z * Math.sin(ang);
    const z = -p.x * Math.sin(ang) + p.z * Math.cos(ang);
    const y = p.y * Math.cos(TILT) - z * Math.sin(TILT);
    const z2 = p.y * Math.sin(TILT) + z * Math.cos(TILT);
    return { x, y, z: z2 };
  }

  function project(v) {
    return { x: cx + v.x * R, y: cy - v.y * R, z: v.z };
  }

  function drawArc(arc, ang) {
    const A = project(rotate({ x: arc.a[0], y: arc.a[1], z: arc.a[2] }, ang));
    const B = project(rotate({ x: arc.b[0], y: arc.b[1], z: arc.b[2] }, ang));
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const cpx = cx + (mx - cx) * arc.lift;
    const cpy = cy + (my - cy) * arc.lift - R * 0.18;

    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.quadraticCurveTo(cpx, cpy, B.x, B.y);
    ctx.strokeStyle = arc.color;
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // pallino di partenza, anello vuoto come nel riferimento
    ctx.beginPath();
    ctx.arc(A.x, A.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = arc.color;
    ctx.stroke();
  }

  let t0 = performance.now();
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function frame(now) {
    const ang = reduce ? 0.6 : ((now - t0) / 1000) * 0.07;
    ctx.clearRect(0, 0, W, H);

    // alone morbido dentro la sfera
    const halo = ctx.createRadialGradient(cx, cy - R * 0.25, R * 0.1, cx, cy, R);
    halo.addColorStop(0, "rgba(255,255,255,0.55)");
    halo.addColorStop(1, "rgba(124,92,250,0.05)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();

    for (const p of pts) {
      const v = rotate(p, ang);
      if (v.z < -0.05) continue;           // solo l'emisfero rivolto verso di noi
      const s = project(v);
      const depth = (v.z + 1) / 2;          // 0 dietro, 1 davanti
      const edge = Math.sqrt(v.x * v.x + v.y * v.y); // 0 centro, 1 bordo
      // densità apparente: più fitto verso il bordo, come nel riferimento
      const alpha = Math.min(1, 0.03 + Math.pow(edge, 3.2) * 1.15) * (0.3 + depth * 0.7);
      const tint = mix(VIOLET, MAGENTA, Math.min(1, Math.max(0, (s.x - cx) / (R * 1.25) + 0.35)));
      const r = (0.45 + p.j * 1.25) * (0.55 + Math.pow(edge, 2) * 0.9);

      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${tint[0]},${tint[1]},${tint[2]},${(alpha * 0.9).toFixed(3)})`;
      ctx.fill();
    }

    // pulviscolo esterno
    for (const p of dust) {
      const v = rotate(p, ang);
      if (v.z < 0) continue;
      const s2 = project(v);
      const tint = mix(VIOLET, MAGENTA, Math.min(1, Math.max(0, (s2.x - cx) / (R * 1.25) + 0.35)));
      ctx.beginPath();
      ctx.arc(s2.x, s2.y, 0.5 + p.j, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${tint[0]},${tint[1]},${tint[2]},${(0.15 + p.j * 0.45).toFixed(3)})`;
      ctx.fill();
    }

    for (const a of arcs) drawArc(a, ang);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
